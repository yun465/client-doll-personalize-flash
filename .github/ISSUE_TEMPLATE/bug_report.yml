name: Bug report
description: Report a reproducible problem without sharing customer-private data.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Never include real chat text, recordings, credentials, MAC addresses, private paths, firmware images, or device backups.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Workflow stage
      options:
        - Skill discovery or installation
        - Chat parsing or persona preview
        - Persona integration
        - Local wake audio
        - Offline build
        - Board identification
        - Flash planning or verification
        - Documentation
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Sanitized environment
      description: Runtime, OS, board profile, toolchain version, and project revision. Use placeholders for private paths and identifiers.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Use synthetic data only.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Include only logs that have been reviewed for customer data and secrets.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed customer chat, recordings, credentials, device identifiers, private paths, and customer firmware artifacts.
          required: true
